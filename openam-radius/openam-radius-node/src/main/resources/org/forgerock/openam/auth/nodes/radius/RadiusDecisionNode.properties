nodeDescription=RADIUS Decision
nodeHelp=This node makes a decision based on the result of a RADIUS authentication attempt.

# Configuration parameters
primaryServers=Primary RADIUS Servers
primaryServers.help=A list of primary RADIUS servers that will be used for authentication.<br/><br/>\
  For a single entry, specify the IP address or fully qualified domain name of the RADIUS server.\
  Optionally, append the port number to the server name using a colon, e.g. <code>radius.example.com:1812</code>.<br/><br/>\
  If no port number is specified, the default port number 1812 is used.<br/><br/>\
  Multiple entries allow associations between AM servers and RADIUS servers.
secondaryServers=Secondary RADIUS Servers
secondaryServers.help=A list of secondary RADIUS servers that will be used for authentication, in case the primary servers are unavailable.<br/><br/>\
  For a single entry, specify the IP address or fully qualified domain name of the RADIUS server.\
  Optionally, append the port number to the server name using a colon, e.g. <code>radius.example.com:1812</code>.<br/><br/>\
  If no port number is specified, the default port number 1812 is used.<br/><br/>\
  Multiple entries allow associations between AM servers and RADIUS servers.
sharedSecretPurpose=RADIUS Shared Secret Label Identifier
sharedSecretPurpose.help=Identifier used to create a secret label for mapping to a secret in a secret store. <br>\
  AM uses this identifier to create a specific secret label for this node. The secret label takes the form \
  <code>am.authentication.nodes.radius.{{identifier}}.secret</code> where {{identifier}} is the value of \
  RADIUS Shared Secret Label Identifier. The identifier can only contain characters {{a-z}} {{A-Z}} {{0-9}} {{.}} \
  and cannot start or end with {{.}}.
timeout=Timeout
timeout.help=Period of time in seconds to wait for the RADIUS server response. This sets the <code>SO_TIMEOUT</code> timeout on the RADIUS packet.
healthCheckInterval=Health Check Interval
healthCheckInterval.help=The interval between checks to unavailable RADIUS servers, in minutes. Determines how often AM checks an offline server's status. \
  The check sends an invalid authentication request to the RADIUS server. Offline servers are not used until the healthcheck is successful. \
  Primary servers that become available are used before secondary servers.
checkForLockout=Stop RADIUS binds after lockout
checkForLockout.help=If enabled, no further bind requests are sent to the RADIUS Server when the user is locked out.
requireMessageAuthenticator=Require Message-Authenticator attribute
requireMessageAuthenticator.help=If enabled, the RADIUS client requires the RADIUS server to include a Message-Authenticator attribute in all its responses. \
  The client also includes a Message-Authenticator attribute in all Access-Request packets it sends to the server.
# Error messages
missingUsernameOrPassword=Username or password is missing from the authentication state.

# Outcome labels
acceptOutcome=Accept
rejectOutcome=Reject
challengeOutcome=Challenge
errorOutcome=Error
