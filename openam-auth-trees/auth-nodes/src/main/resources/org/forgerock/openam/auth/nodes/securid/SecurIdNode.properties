nodeDescription=RSA SecurID
nodeHelp=Allow users to authenticate using RSA SecurID.
baseUrl=SecurID URL
baseUrl.help=The URL for an instance of RSA Authentication Manager or the RSA Cloud Authentication Service.
clientId=Client ID
clientId.help=The string RSA uses to determine principal identity and access control. Optional for the Cloud \
  Authentication Service, required for Authentication Manager.
assurancePolicy=Assurance Policy
assurancePolicy.help=The name of the assurance policy to be used by RSA SecurID. Applies only to the Cloud \
  Authentication Service.
clientKeyPurpose=Client Key Secret Label Identifier
clientKeyPurpose.help=The identifier for the unique key for communication between AM and the RSA API.
authnAttemptTimeout=Authentication Attempt Timeout
authnAttemptTimeout.help=The number of seconds before RSA SecurID times out the authentication request. Applies only \
  to the Cloud Authentication Service.
httpClient=HTTP Client
httpClient.help=The HTTP Client to use for communication with the RSA API. If you don't have a custom HTTP Client, \
  leave this blank to use the default HTTP Client.
mfaChoicePrompt=Prompt for MFA Choice
mfaChoicePrompt.help=Localization overrides for the message displayed to the user when requesting an MFA \
  method. Key-value map of language to localized message. \
  The value defaults to "Select your preferred MFA method" if no overrides are provided.
default.mfaChoicePrompt=Select your preferred MFA method
waitingMessage=Waiting Message
waitingMessage.help=Localization overrides for the message displayed to the user to respond to a push notification. \
  Key-value map of language to localized message. \
  The value defaults to "Waiting for your response" if no overrides are provided.
default.waitingMessage=Waiting for your response

#outcomes
SuccessOutcome=Success
FailureOutcome=Failure
NotEnrolledOutcome=Not Enrolled
CancelOutcome=Cancel
ErrorOutcome=Error
