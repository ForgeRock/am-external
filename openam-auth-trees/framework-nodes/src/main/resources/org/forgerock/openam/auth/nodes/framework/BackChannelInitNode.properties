nodeDescription=Backchannel Initialize
nodeHelp=Initialize a separate journey to run asynchronously, possibly by a different user or agent.

tree=Journey
tree.help=The journey to initialize.
idType=Subject Type
idType.help=The type of subject (User or Agent) to initialize the journey for. \
  If None, any subject can log in using the generated journey.
usernameKey=Subject Name Key
usernameKey.help=The node state key that contains the user ID of the subject to initialize the journey for. \
  This property is ignored if Subject Type is None.
dataKey=Data Object Key
dataKey.help=The node state key that contains the data object (if present) to pass to the journey at the root level \
  of shared state.
timeout=Max Time (Seconds)
timeout.help=The number of seconds to wait for the backchannel journey to complete before timing out. If you \
  don't set this, AM uses the default transaction timeout for the realm.
subjectType.user=User
subjectType.agent=Agent
subjectType.none=None
redirectUrlType=Redirect URL Type
redirectUrlType.help=The type of redirect URL to save to node state.
redirectUrlType.get=Get
redirectUrlType.post=Post
redirectUrlType.custom=Custom
redirectUrlType.none=None
customRedirectUrl=Custom Redirect URL
customRedirectUrl.help=The custom redirect URL to save to node state. \
  This property is only taken into account if Redirect URL Type is Custom.
allowRetry=Allow Retry
allowRetry.help=If true, the end user can retry the backchannel journey if it fails. There's no maximum _number_ of \
  retries, but the retry window ends after the `Max Time`.
created=Created
unknown=Unknown Subject
error=Error